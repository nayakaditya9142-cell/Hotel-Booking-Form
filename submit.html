<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed | LuxeStay</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .success-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .checkmark-circle {
            width: 80px;
            height: 80px;
            background: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            box-shadow: 0 0 0 10px rgba(34, 197, 94, 0.2);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .btn-home {
            text-decoration: none;
            display: inline-block;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="background-overlay"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <main class="container">
        <div class="booking-card animate-enter success-card">
            <div class="checkmark-circle">✓</div>

            <header class="card-header" style="margin-bottom: 0.5rem;">
                <h1>Booking Confirmed!</h1>
                <p>Thank you for choosing LuxeStay. We have sent a confirmation email to you.</p>
            </header>

            <a href="index.html" class="btn-submit btn-home">Back to Home</a>
        </div>
    </main>
</body>

</html>
