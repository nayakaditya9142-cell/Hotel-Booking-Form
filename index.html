<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeStay | Premium Hotel Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-overlay"></div>
    <!-- Animated Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <main class="container">
        <div class="booking-card animate-enter">
            <header class="card-header">
                <h1>Book Your Stay</h1>
                <p>Experience luxury at its finest</p>
            </header>

            <form action="https://api.web3forms.com/submit" method="POST" id="bookingForm" class="booking-form"
                novalidate>
                <input type="hidden" name="access_key" value="369c0563-5b99-4c5d-9279-53dec62b0f76">
                <!-- Build form with CSS Grid/Flex -->
                <div class="form-grid">

                    <!-- Check-in Date -->
                    <div class="input-group">
                        <label for="checkIn">Check-in Date</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📅</span>
                            <input type="date" id="checkIn" name="checkIn" required>
                        </div>
                        <span class="error-message">Please select a valid check-in date</span>
                    </div>

                    <!-- Check-out Date -->
                    <div class="input-group">
                        <label for="checkOut">Check-out Date</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📅</span>
                            <input type="date" id="checkOut" name="checkOut" required disabled>
                        </div>
                        <span class="error-message">Check-out must be after check-in</span>
                    </div>

                    <!-- Room Type -->
                    <div class="input-group">
                        <label for="roomType">Room Type</label>
                        <div class="select-wrapper input-wrapper">
                            <span class="input-icon">🛏️</span>
                            <select id="roomType" name="roomType" required>
                                <option value="" disabled selected>Select a room</option>
                                <option value="single">Single Room</option>
                                <option value="double">Double Room</option>
                                <option value="deluxe">Deluxe Suite</option>
                                <option value="penthouse">Presidential Suite</option>
                            </select>
                        </div>
                        <span class="error-message">Please select a room type</span>
                    </div>

                    <!-- Guests Row -->
                    <div class="form-row">
                        <div class="input-group">
                            <label for="adults">Adults</label>
                            <div class="input-wrapper">
                                <span class="input-icon">👤</span>
                                <input type="number" id="adults" name="adults" min="1" max="5" value="1" required>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="children">Children</label>
                            <div class="input-wrapper">
                                <span class="input-icon">👶</span>
                                <input type="number" id="children" name="children" min="0" max="5" value="0">
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Special Requests -->
                <div class="input-group full-width">
                    <label for="requests">Special Requests (Optional)</label>
                    <div class="input-wrapper">
                        <textarea id="requests" name="requests" rows="3"
                            placeholder="Early check-in, dietary needs, etc." style="padding-top: 10px;"></textarea>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">
                    <span class="btn-text">Check Availability</span>
                    <div class="shimmer"></div>
                </button>
            </form>
        </div>
    </main>

    <div id="toast" class="toast">Booking Request Sent Successfully!</div>

    <script src="script.js"></script>
</body>

</html>
