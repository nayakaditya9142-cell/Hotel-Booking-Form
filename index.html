<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Escape</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay">

  <h1 class="hero-text">Experience Comfort at Bikram’s Hotel ✨
</h1>

  <div class="booking-card">

    <form id="bookingForm">

      <!-- ✅ USER DETAILS -->
      <div class="input-box">
        <label>Full Name</label>
        <input type="text" id="username" required>
      </div>

      <div class="input-box">
        <label>Phone Number</label>
        <input type="tel" id="phone" required>
      </div>

      <!-- ✅ DATE SECTION -->
      <div class="row">
        <div class="input-box">
          <label>Check-In</label>
          <input type="date" id="checkin" required>
        </div>

        <div class="input-box">
          <label>Check-Out</label>
          <input type="date" id="checkout" required>
        </div>
      </div>

      <!-- ✅ ROOM SELECTION -->
      <div class="input-box">
        <label>Select Room</label>
        <select id="room" required>
          <option value="">Choose Room</option>
          <option value="1000">Single- ₹1000/night</option>
          <option value="2500">Double - ₹2500/night</option>
          <option value="4000">Suite - ₹4000/night</option>
        </select>
      </div>

      <!-- ✅ GUEST COUNT -->
      <div class="input-box">
  <label>Guests</label>
  <input type="number" id="guests" min="1" max="4" required>
</div>

      <!-- ✅ TOTAL PRICE -->
      <div class="price-display">
        Total Price: <span id="total">₹0</span>
      </div>

      <!-- ✅ BUTTON -->
      <button type="submit">Book Now 🚀</button>

      <p id="message"></p>

    </form>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
  emailjs.init("YOUR_PUBLIC_KEY");
})();
</script>
<script src="script.js"></script>
</body>
</html>
